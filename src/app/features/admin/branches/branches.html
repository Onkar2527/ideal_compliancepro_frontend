<div class="card">
  <div class="flex align-items-center justify-content-between mb-4">
    <h5 class="m-0 text-xl font-semibold">Branch and Department Master</h5>
  </div>
      <app-table
          [data]="filteredBranches()"
          [columns]="tableColumns"
          [loading]="loading()"
          [actions]="tableActions"
          (onAdd)="openNew()"
          [showRefreshButton]="true"
          [paginator]="true"
          [rows]="10"
          (onRefresh)="loadBranches(true)"
      >
        <div toolbar-actions class="flex align-items-center ml-2">
          <p-select
            [options]="filterOptions"
            [ngModel]="selectedTypeFilter()"
            (ngModelChange)="selectedTypeFilter.set($event)"
            placeholder="Filter by Type"
            [showClear]="true"
            optionLabel="label"
            optionValue="value"
            class="w-16rem"
            styleClass="h-2.5rem flex align-items-center animate-fadein"
          ></p-select>
        </div>
      </app-table>
    </div>

<p-drawer
    [visible]="branchDialog()"
    (visibleChange)="branchDialog.set($event)"
    position="right"
    [style]="{ width: '450px', maxWidth: '96vw' }"
    [modal]="true"
    [dismissible]="true"
    [showCloseIcon]="false"
    styleClass="drawer-layout"
    appendTo="body"
>
    <ng-template pTemplate="header">
        <div class="drawer-header-row">
            <div class="drawer-title-wrap">
                <span class="drawer-title-icon">
                    <i class="pi pi-map-marker"></i>
                </span>
                <div>
                    <div class="text-900 font-semibold text-xl">Branch / Dept Details</div>
                    <div class="text-600 text-sm mt-1">Manage dept/branch information</div>
                </div>
            </div>
            <button pButton pRipple type="button" icon="pi pi-times" class="p-button-text p-button-rounded" (click)="hideDialog()"></button>
        </div>
    </ng-template>

    <ng-template pTemplate="content">
        <div class="drawer-content-shell">
            <section class="drawer-section">
                <div class="section-heading">
                    <span class="section-kicker">Dept / Branch Info</span>
                    <span class="section-line"></span>
                </div>
                <div class="grid formgrid p-fluid drawer-form-grid">
                    <div class="field col-12">
                        <app-text-field
                            label="Name"
                            [field]="branchName"
                            [required]="true"
                            [error]="submitted() && !branchName() ? 'Name is required' : ''">
                        </app-text-field>
                    </div>
                    <div class="field col-12">
                        <app-select-field
                            label="Type"
                            [field]="branchType"
                            [options]="branchTypes"
                            optionLabel="label"
                            optionValue="value"
                            [required]="true"
                            [virtualScroll]="false"
                            [error]="submitted() && !branchType() ? 'Type is required' : ''">
                        </app-select-field>
                    </div>
                    <div class="field col-12" *ngIf="branchType() === 'DEPARTMENT'">
                        <app-select-field
                            label="Parent Department"
                            [field]="parentId"
                            [options]="parentDepartmentOptions()"
                            optionLabel="label"
                            optionValue="value"
                            placeholder="Select Parent (Optional)"
                            [showClear]="true"
                            [virtualScroll]="false">
                        </app-select-field>
                        <small class="text-gray-500 block mt-1" style="font-size: 0.75rem;">
                          Leave empty if this is a Top-Level / Main Department (e.g. IT, Finance).
                        </small>
                    </div>
                </div>
            </section>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <div class="drawer-footer-row">
            <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-outlined p-button-secondary" (click)="hideDialog()"></button>
            <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-primary" [loading]="saving()" [disabled]="saving()" (click)="saveBranch()"></button>
        </div>
    </ng-template>
</p-drawer>
