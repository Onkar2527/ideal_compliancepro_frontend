<p-toast></p-toast>

<div class="login-page">
  <!-- Theme Toggle Button in Top Right Corner -->
  <div class="login-theme-toggle">
    <button pButton type="button" [icon]="layoutService.layoutConfig().darkTheme ? 'pi pi-moon' : 'pi pi-sun'"
      severity="secondary" (click)="toggleTheme()" aria-label="Toggle theme"></button>
  </div>

  <!-- Fixed Banner -->
  <div class="top-banner">
    <div class="glow-node node-1"></div>
    <div class="glow-node node-2"></div>
    <div class="glow-node node-3"></div>
  </div>

  <!-- Background Floating Shapes in White Space -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Scrollable Content -->
  <div class="content-section">
    <!-- Brand -->
    <div class="brand-section animate-item">
      <h1>Compliance Pro</h1>
      <p>AI POWERED COMPLIANCE MANAGEMENT</p>
    </div>

    <!-- Login -->
    <div class="login-wrapper">
      <div class="login-card animate-item delay-1">
        <h2>Login to Your Account</h2>

        <div class="company-name">Compliance Pro Access</div>

        <div class="divider"></div>

        <div>
          <p class="login-text">Login to start your session!</p>

          <form #loginForm="ngForm" (ngSubmit)="onLogin()" autocomplete="off">
            <!-- Username -->
            <div class="input-group animate-item delay-2">
              <label for="username">Employee Code</label>
              <div class="input-icon-wrapper">
                <i class="pi pi-user input-icon"></i>
                <input
                  id="username"
                  pInputText
                  type="text"
                  [(ngModel)]="username"
                  name="username"
                  placeholder="Enter Employee Code"
                  class="w-full custom-input icon-indent"
                  required
                  autocomplete="username"
                />
              </div>
            </div>

            <!-- Password -->
            <div class="input-group animate-item delay-3">
              <label for="password">Password</label>
              <div class="input-icon-wrapper">
                <i class="pi pi-lock input-icon"></i>
                <p-password
                  inputId="password"
                  [(ngModel)]="password"
                  name="password"
                  [toggleMask]="true"
                  [feedback]="false"
                  placeholder="Enter Password"
                  styleClass="w-full"
                  inputStyleClass="w-full custom-input icon-indent"
                  autocomplete="current-password"
                  required
                >
                </p-password>
              </div>
            </div>

            <!-- Login Button -->
            <button
              pButton
              type="submit"
              [loading]="loading()"
              [disabled]="loading() || !username || !password"
              class="login-btn animate-item delay-4"
            >
              {{ loading() ? 'Logging in...' : 'Login' }}
            </button>

            <!-- Quick Demo Login Section -->
            <div class="demo-section animate-item delay-4">
              <div class="demo-divider">
                <span>Demo Auto Login</span>
              </div>
              <div class="demo-buttons-grid">
                <button
                  *ngFor="let user of demoUsers"
                  type="button"
                  class="demo-user-btn"
                  [attr.data-role]="user.label.toLowerCase()"
                  (click)="quickLogin(user.username, user.password)"
                  [disabled]="loading()"
                >
                  {{ user.label }}
                </button>
              </div>
            </div>

            <!-- Language Selector (Segmented Control matching ideal-auditpro) -->
            <div class="login-language-selector animate-item delay-4">
              <div class="segmented-control">
                <input
                  type="radio"
                  id="lang-en"
                  name="lang"
                  value="en"
                  [(ngModel)]="selectedLanguage"
                  (change)="onLanguageChange('en')"
                />
                <label for="lang-en">English</label>

                <input
                  type="radio"
                  id="lang-mr"
                  name="lang"
                  value="mr"
                  [(ngModel)]="selectedLanguage"
                  (change)="onLanguageChange('mr')"
                />
                <label for="lang-mr">मराठी</label>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
